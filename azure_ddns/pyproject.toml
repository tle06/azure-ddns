[project]
name = "azure_ddns"
version = "0.0.4"
description = "Dynamic DNS updates for Azure DNS zones based on current public IP"
authors = [{ name = "tle06", email = "tle@tlnk.fr" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.25.3,<2",
    "azure-mgmt-dns>=9.0.0,<10",
]

[project.urls]
Homepage = "https://github.com/tle06/azure-ddns"
Repository = "https://github.com/tle06/azure-ddns"

[project.scripts]
azure-ddns = "azure_ddns.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["azure_ddns"]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "black>=25,<27",
    "flake8>=7.3,<8",
]

[tool.black]
line-length = 100
target-version = ["py310"]
